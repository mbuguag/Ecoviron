<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="post-title">Blog Post | BionixEHS</title>
  <meta name="description" content="Read our latest blog post on BionixEHS">
  <meta property="og:title" content="Blog Post | BionixEHS">
  <meta property="og:description" content="Read our latest blog post on BionixEHS">
  <meta property="og:image" content="https://www.bionixehs.com/images/blog-default.jpg">
  <meta property="og:url" content="https://www.bionixehs.com/blog-details.html">
  <meta property="og:type" content="article">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:creator" content="@BionixEHS">
  <meta name="keywords" content="BionixEHS, blog, article, insights">

  <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet" />
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" as="style"
    onload="this.onload=null;this.rel='stylesheet';">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Dynamic SEO Meta Tags will be set by JavaScript -->
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/blog.css" />
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BlogPosting",
      "headline": "Blog Post Title",
      "description": "Blog post description",
      "author": {
        "@type": "Organization",
        "name": "BionixEHS",
        "url": "https://www.bionixehs.com"
      },
      "datePublished": "2025-07-30",
      "image": "https://www.bionixehs.com/images/blog-default.jpg"
    }
    </script>
</head>
<body>
  <div id="header-container"></div>

  <main class="blog-detail-section container">
    <article id="blog-post">
      <div class="post-header">
        <div id="post-meta"></div>
        <div class="social-share">
          <span class="share-label">Share:</span>
          <button class="share-btn facebook" aria-label="Share on Facebook">
            <i class="fab fa-facebook-f"></i>
          </button>
          <button class="share-btn twitter" aria-label="Share on Twitter">
            <i class="fab fa-twitter"></i>
          </button>
          <button class="share-btn linkedin" aria-label="Share on LinkedIn">
            <i class="fab fa-linkedin-in"></i>
          </button>
        </div>
      </div>
      
      <div id="post-content"></div>
      
      <div class="post-footer">
        <div id="post-tags"></div>
        <div class="view-count">
          <i class="fas fa-eye"></i> <span id="views-counter">0</span> views
        </div>
      </div>
    </article>

    <section class="related-posts">
      <h2>Related Articles</h2>
      <div class="grid-three-columns" id="related-posts"></div>
    </section>
  </main>

  <footer id="footer-container"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
<script type="module" src="../js/main.js"></script>

  <script type="module" src="../js/blog-details.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({ duration: 1000, once: true });
  </script>
</body>
</html>
