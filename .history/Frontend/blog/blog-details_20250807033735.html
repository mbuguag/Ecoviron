<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="post-title">Blog Post | BionixEHS</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet" />

  <meta name="description" content="">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:image" content="">
  <meta property="og:url" content="">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Dynamic SEO Meta Tags will be set by JavaScript -->
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/blog.css" />
</head>
<body>
  <div id="header-container"></div>
  <nav class="breadcrumb" aria-label="breadcrumb" style="padding: 10px 20px; font-size: 0.9rem;">
    <ol style="list-style: none; display: flex; flex-wrap: wrap; gap: 5px;">
      <li><a href="../index.html" style="text-decoration: none; color: #007bff;">Home</a> &gt;</li>
      <li><a href="/" style="text-decoration: none; color: #007bff;">Blogs</a> &gt;</li>
      <li style="color: #6c757d;">Blog Details</li>
    </ol>
  </nav>

  <main class="blog-detail-section container">
    <article id="blog-post">
      <div class="post-header">
        <div id="post-meta"></div>
        <div class="social-share">
          <button class="share-btn facebook" aria-label="Share on Facebook"><i class="fab fa-facebook-f"></i></button>
          <button class="share-btn twitter" aria-label="Share on X"><i class="fab fa-twitter"></i></button>
          <button class="share-btn linkedin" aria-label="Share on linkedin"><i class="fab fa-linkedin-in"></i></button>
        </div>
      </div>
      
      <div id="post-content"></div>
      
      <div class="post-footer">
        <div id="post-tags"></div>
        <div class="blog-meta">
          <i class="fa fa-eye"></i>
          <span id="view-count">Loading views...</span>
        </div>

      </div>
    </article>

    <section class="related-posts">
      <h2>Related Articles</h2>
      <div class="grid-three-columns" id="related-posts"></div>
    </section>
  </main>

  <footer id="footer-container"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
<script type="module" src="js/main.js"></script>

  <script type="module" src="../js/blog-details.js"></script>
</body>
</html>
