<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  
  <title>[Blog Post Title] | Environmental Best Practices | BionixEHS Kenya</title>
  <meta name="description" content="[2-3 sentence excerpt from post highlighting key insights. Include terms like 'EIA compliance', 'WASH solutions', or 'sustainable development Kenya']" />
  <meta name="keywords" content="[primary keyword], [secondary keyword], environmental consultancy Kenya, NEMA regulations" />
  <meta name="author" content="[Philip Gitau]" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://www.bionix-hse.co.ke/blog/[post-slug]/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:title" content="[Blog Post Title] | BionixEHS Insights" />
  <meta property="og:description" content="[Truncated engaging excerpt - first 50 words]" />
  <meta property="og:image" content="https://www.bionix-hse.co.ke/assets/blog-images/[featured-image].jpg" /> //upload image
  <meta property="og:url" content="https://www.bionix-hse.co.ke/blog/[post-slug]/" />
  <meta property="og:type" content="article" />
  <meta property="article:published_time" content="[YYYY-MM-DD]" />
  <meta property="article:author" content="[Author Name]" />
  <meta property="article:section" content="Environmental Compliance" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="[Blog Post Title] | Key Takeaways" />
  <meta name="twitter:description" content="[Different excerpt focusing on actionable advice]" />
  <meta name="twitter:image" content="https://www.bionix-hse.co.ke/assets/blog-images/[twitter-optimized-image].jpg" /> // upload image

  <!-- Article Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": "[Blog Post Title]",
    "description": "[Full meta description]",
    "author": {
      "@type": "Person",
      "name": "[Author Name]",
      "url": "https://www.bionix-hse.co.ke/team/[author-slug]"
    },
    "datePublished": "[YYYY-MM-DD]",
    "image": {
      "@type": "ImageObject",
      "url": "https://www.bionix-hse.co.ke/assets/blog-images/[featured-image].jpg", // upload image
      "width": "1200",
      "height": "630"
    },
    "publisher": {
      "@type": "Organization",
      "name": "BionixEHS",
      "logo": {
        "@type": "ImageObject",
        "url": "https://www.bionix-hse.co.ke/assets/icons/logo.png",
        "width": "200",
        "height": "60"
      }
    }
  }
  </script>

   <link rel="icon" type="image/png" href="/frontend/assets/icons/favicons/favicon-96x96.png" sizes="96x96" />
<link rel="apple-touch-icon" sizes="180x180" href="/frontend/assets/icons/favicons/apple-touch-icon.png" />

  
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" as="style" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>
  <div id="header-container"></div>

  <main class="blog-detail-section container">
    <article id="blog-post">
      <!-- JS inserts content -->
    </article>
  </main>

  <footer id="footer-container"></footer>

  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/blog-details.js"></script>
</body>
</html>
