<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Environmental Blog | Latest EIA, WASH & Sustainability Insights | BionixEHS Kenya</title>
  <!-- SEO Meta Tags remain the same -->
   <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/blog.css" />
</head>
<body>

  <div id="header-container"></div>

  <main>
    <section class="hero blog-hero">
      <div class="hero-content">
        <h1>Environmental Insights</h1>
        <p>Expert articles on compliance, sustainability, and best practices in Kenya</p>
        <div class="search-container">
          <input type="text" id="blog-search" placeholder="Search articles...">
          <button id="search-btn"><i class="fas fa-search"></i></button>
        </div>
      </div>
    </section>

    <section class="section-padding">
      <div class="container">
        <div class="filter-controls">
          <div class="tag-filters" id="popular-tags"></div>
          <select id="sort-options">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
            <option value="popular">Most Viewed</option>
          </select>
        </div>
        
        <div class="grid-three-columns" id="blog-grid">
          <!-- Blog cards will be injected here -->
        </div>
        
        <div class="pagination-controls" id="pagination"></div>
      </div>
    </section>
  </main>

  <footer id="footer-container"></footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
<script type="module" src="js/main.js"></script>
  <script type="module" src="../js/"></script>
</body>
</html>
