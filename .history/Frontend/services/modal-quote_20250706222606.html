<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="header-container"></div>
    <main>
    <!-- quote-modal.html -->
<div id="quoteModal" class="modal-overlay" style="display: none;">
  <div class="modal">
    <span class="close-btn" id="closeModal">&times;</span>
    <h2>Request a Quote</h2>
    <form id="quoteForm">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Your Email</label>
      <input type="email" id="email" name="email" required />

      <label for="service">Service Needed</label>
      <input type="text" id="service" name="service" placeholder="e.g. OSHA Audit" required />

      <label for="message">Additional Details</label>
      <textarea id="message" name="message" rows="4" placeholder="Optional message..."></textarea>

      <button type="submit" class="btn-primary">Submit Request</button>
    </form>
  </div>
</div>
</main>

<div id="footerr"></div>
</body>
</html>
