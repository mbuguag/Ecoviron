<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Management | BionixEHS Admin</title>
  <link rel="stylesheet" href="../admin/css/admin-blog.css">
  <link rel="stylesheet" href="../css/editor.css">
</head>
<body>
  <div class="sidebar">
      <h2>EcoAdmin</h2>
      <a
        href="../admin/admin-dashboard.html"
        onclick="showSection('dashboard'); setActive(this)"
        class="active"
        >Dashboard</a
      >
      <a href="../admin/admin-dashboard.html" onclick="showSection('products'); setActive(this)"
        >Products</a
      >
      <a href="../admin/admin-orders.html" onclick="showSection('orders'); setActive(this)">Orders</a>
      <a href="../" onclick="showSection('users'); setActive(this)">Users</a>
      <a href="../admin/admin-blog.html" onclick="showSection('blogs'); setActive(this)">Blogs</a>
      <a href="#" onclick="showSection('contacts'); setActive(this)">
        Messages</a
      >
      <a href="#" onclick="showSection('quotes'); setActive(this)">Quotes</a>


      <a href="logout.html">Logout</a>
    </div>

    <main class="admin-content">
      <header class="admin-header">
        <h1>Blog Management</h1>
        <button id="new-post-btn" class="btn-primary">
          <i class="fas fa-plus"></i> New Post
        </button>
      </header>

      <div class="admin-toolbar">
        <div class="search-box">
          <input type="text" placeholder="Search posts...">
          <button><i class="fas fa-search"></i></button>
        </div>
        <div class="filter-controls">
          <select id="status-filter">
            <option value="all">All Statuses</option>
            <option value="DRAFT">Draft</option>
            <option value="PUBLISHED">Published</option>
            <option value="ARCHIVED">Archived</option>
          </select>
        </div>
      </div>

      <div class="posts-table">
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>Status</th>
              <th>Published</th>
              <th>Views</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="posts-list">
            <!-- Posts will be loaded here -->
          </tbody>
        </table>
      </div>

      <div class="pagination-controls" id="admin-pagination"></div>
    </main>
  </div>

  <!-- Blog Editor Modal -->
  <div id="editor-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="editor-title">New Blog Post</h2>
        <button class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <form id="post-form">
          <input type="hidden" id="post-id">
          
          <div class="form-group">
            <label for="post-title">Title*</label>
            <input type="text" id="post-title" required>
          </div>
          
          <div class="form-group">
            <label for="post-slug">Slug*</label>
            <input type="text" id="post-slug" required>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label for="post-status">Status</label>
              <select id="post-status">
                <option value="DRAFT">Draft</option>
                <option value="PUBLISHED">Published</option>
              </select>
            </div>
            <div class="form-group">
              <label for="publish-date">Publish Date</label>
              <input type="datetime-local" id="publish-date">
            </div>
          </div>
          
          <div class="form-group">
            <label for="post-snippet">Excerpt*</label>
            <textarea id="post-snippet" rows="3" required></textarea>
          </div>
          
          <div class="form-group">
            <label for="post-content">Content*</label>
            <div id="post-content-editor"></div>
          </div>
          
          <div class="form-group">
            <label>Featured Image</label>
            <div class="image-upload">
              <img id="image-preview" src="" alt="Preview">
              <input type="file" id="image-upload" accept="image/*">
              <label for="image-upload" class="btn-outline">Upload Image</label>
            </div>
          </div>
          
          <div class="form-group">
            <label for="meta-description">Meta Description</label>
            <textarea id="meta-description" rows="2"></textarea>
          </div>
          
          <div class="form-group">
            <label for="post-tags">Tags</label>
            <input type="text" id="post-tags" placeholder="Add tags separated by commas">
          </div>
          
          <div class="form-actions">
            <button type="button" class="btn-outline" id="cancel-btn">Cancel</button>
            <button type="submit" class="btn-primary">Save Post</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="../js/admin-blog.js"></script>
</body>
</html>
