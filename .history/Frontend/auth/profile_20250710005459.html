<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>User Profile | Ecoviron</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/profile.css" />
</head>
<body>

<div class="profile-container">
  <aside class="sidebar">
    <div class="profile-picture-container">
      <img id="profile-picture" src="../images/default-avatar.png" alt="Profile Picture" />
      <input type="file" id="upload-picture" hidden />
      <button id="change-picture-btn">Change Picture</button>
    </div>
    <nav class="profile-nav">
      <ul>
        <li data-section="info" class="active">Profile Info</li>
        <li data-section="orders">Order History</li>
        <li data-section="wishlist">Wishlist</li>
        <li data-section="security">Security Settings</li>
        <li><button id="logout-btn">Logout</button></li>
      </ul>
    </nav>
  </aside>

  <main class="profile-content">
    <section id="info-section" class="section active">
      <h2>Profile Info</h2>
      <form id="profile-form">
        <div class="form-group">
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" name="fullName" required />
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required />
        </div>
        <button type="submit" class="btn">Update Profile</button>
      </form>
    </section>

    <section id="orders-section" class="section">
      <h2>Order History</h2>
      <p>Loading your orders...</p>
      <div id="order-history"></div>
    </section>

    <section id="wishlist-section" class="section">
      <h2>Wishlist</h2>
      <p>Loading wishlist items...</p>
      <div id="wishlist-items"></div>
    </section>

    <section id="security-section" class="section">
      <h2>Security Settings</h2>
      <form id="password-form">
        <div class="form-group">
          <label for="current-password">Current Password</label>
          <input type="password" id="current-password" required />
        </div>
        <div class="form-group">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" required />
        </div>
        <button type="submit" class="btn">Change Password</button>
      </form>
    </section>
  </main>
</div>

<script type="module" src="../js/profile.js"></script>
</body>
</html>
