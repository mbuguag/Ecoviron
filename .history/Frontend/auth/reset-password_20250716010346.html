<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Your Password | Ecoviron</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .auth-wrapper {
      display: flex;
      min-height: 100vh;
    }

    .auth-image {
      flex: 1;
      background: url('../assets/images/workplace-.jpg') center center/cover no-repeat;
      display: none;
    }

    .auth-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background-color: #f9f9f9;
    }

    .auth-form {
      width: 100%;
      max-width: 400px;
      background: white;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
    }

    .auth-form input {
      width: 100%;
      padding: 0.8rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 10px;
      top: 12px;
      cursor: pointer;
      color: #888;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      color: #fff;
      padding: 1rem 2rem;
      border-radius: 5px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      pointer-events: auto;
    }

    @media (min-width: 768px) {
      .auth-image {
        display: block;
      }
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-image"></div>

    <div class="auth-content">
      <form id="resetForm" class="auth-form">
        <h2 style="text-align:center;">Reset Your Password</h2>

        <div class="password-wrapper">
          <input type="password" id="newPassword" placeholder="New Password" required />
          <i class="fa-solid fa-eye toggle-password" data-target="newPassword"></i>
        </div>

        <div class="password-wrapper">
          <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
          <i class="fa-solid fa-eye toggle-password" data-target="confirmPassword"></i>
        </div>

        <button type="submit" class="btn">Reset Password</button>
        <div id="resetMessage" class="form-response"></div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module">
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const token = params.get("token");
      const form = document.getElementById("resetForm");
      const messageDiv = document.getElementById("resetMessage");

      if (!token) {
        form.style.display = "none";
        messageDiv.textContent = "Invalid or missing reset token.";
        messageDiv.style.color = "red";
        return;
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const newPassword = document.getElementById("newPassword").value.trim();
        const confirmPassword = document.getElementById("confirmPassword").value.trim();

        if (newPassword.length < 6) {
          messageDiv.textContent = "Password must be at least 6 characters.";
          messageDiv.style.color = "red";
          return;
        }

        if (newPassword !== confirmPassword) {
          messageDiv.textContent = "Passwords do not match.";
          messageDiv.style.color = "red";
          return;
        }

        try {
          const res = await fetch("http://localhost:8080/api/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, newPassword })
          });

          if (res.ok) {
            showToast("Password reset successful. Redirecting...");
            setTimeout(() => {
              window.location.href = "login.html";
            }, 3000);
          } else {
            const error = await res.text();
            messageDiv.textContent = error || "Failed to reset password.";
            messageDiv.style.color = "red";
          }
        } catch (err) {
          messageDiv.textContent = "Something went wrong.";
          messageDiv.style.color = "red";
        }
      });

      // Toggle password visibility
      document.querySelectorAll(".toggle-password").forEach((icon) => {
        icon.addEventListener("click", () => {
          const targetId = icon.getAttribute("data-target");
          const input = document.getElementById(targetId);
          const isPassword = input.type === "password";
          input.type = isPassword ? "text" : "password";
          icon.classList.toggle("fa-eye-slash", isPassword);
        });
      });
    });

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 3000);
    }
  </script>
</body>
</html>
