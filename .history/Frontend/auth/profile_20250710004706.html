<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile | Ecoviron</title>
  <link rel="stylesheet" href="../css/profile.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
  <div id="header-container"></div>

  <main class="profile-container">
    <aside class="profile-sidebar">
      <div class="profile-pic-section">
        <img src="../images/default-avatar.png" alt="Profile Picture" id="profile-pic-preview">
        <input type="file" id="profile-pic-input" accept="image/*">
        <label for="profile-pic-input" class="upload-btn">Change Picture</label>
      </div>
      <nav class="sidebar-nav">
        <ul>
          <li data-section="info" class="active">Profile Info</li>
          <li data-section="orders">Order History</li>
          <li data-section="wishlist">Wishlist</li>
          <li data-section="security">Security</li>
        </ul>
      </nav>
      <button id="logout-btn" class="btn logout">Logout</button>
    </aside>

    <section class="profile-content">
      <div id="section-info" class="profile-section active">
        <h2>Edit Profile Info</h2>
        <form id="profile-form">
          <label>Full Name <input type="text" id="profile-name" name="name" required /></label>
          <label>Email Address <input type="email" id="profile-email" name="email" required /></label>
          <button type="submit" class="btn primary">Save Changes</button>
        </form>
      </div>

      <div id="section-orders" class="profile-section">
        <h2>Order History</h2>
        <div id="order-history"></div>
      </div>

      <div id="section-wishlist" class="profile-section">
        <h2>Wishlist</h2>
        <div id="wishlist-items"></div>
      </div>

      <div id="section-security" class="profile-section">
        <h2>Change Password</h2>
        <form id="password-form">
          <label>Current Password <input type="password" id="current-password" required /></label>
          <label>New Password <input type="password" id="new-password" required /></label>
          <label>Confirm New Password <input type="password" id="confirm-password" required /></label>
          <button type="submit" class="btn primary">Update Password</button>
        </form>
      </div>
    </section>
  </main>

  <footer id="footer-container"></footer>

  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/profile.js"></script>
</body>

</html>
