<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Ecoviron</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div id="header-container"></div>

  <main class="section-padding">
    <div class="container">
      <h2>Login</h2>
      <div id="loginMessage" class="success-message"></div>

      <form id="loginForm" class="auth-form">
        <div class="profile-icon-container">
          <i class="fas fa-user-circle"></i>
        </div>

        <input type="email" name="email" placeholder="Email Address" required />
        <input type="password" name="password" placeholder="Password" required />
        <div class="password-wrapper">
  <input type="password" id="password" name="password" placeholder="Password" required />
  <i class="fa fa-eye toggle-password" toggle="#password"></i>
</div>

        <div class="forgot-password">
          <a href="forgot-password.html">Forgot Password?</a>
        </div>

        <button type="submit" class="btn">Login</button>

        <!-- <hr />
<div style="text-align: center; margin-top: 1rem;">
  <button class="btn" style="background-color: #37da52;"><i class="fab fa-google"></i> Sign in with Google</button>
</div> -->

      </form>
      <p>Don't have an account? <a href="register.html">Register here</a></p>
    </div>
  </main>
 
  <script type="module" src="../js/auth.js"></script>
  <script type="module">
    import { handleLogin } from "../js/auth.js";
    handleLogin("loginForm", "http://localhost:8080/api/auth/login");
  </script>
</body>
</html>
