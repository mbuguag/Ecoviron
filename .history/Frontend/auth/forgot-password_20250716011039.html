<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forgot Password | Ecoviron</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    .auth-wrapper {
      display: flex;
      min-height: 100vh;
    }

    .auth-image {
      flex: 1;
      background: url('../assets/images/about-hero.jpg') no-repeat center center;
      background-size: cover;
    }

    .auth-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .auth-form-box {
      max-width: 400px;
      width: 100%;
    }

    .auth-form-box h2 {
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background-color: #28a745;
      color: white;
      padding: 1rem 1.5rem;
      border-radius: 8px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 9999;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 768px) {
      .auth-wrapper {
        flex-direction: column;
      }

      .auth-image {
        height: 200px;
      }

      .auth-content {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-image"></div>

  <div class="auth-content">
    <div class="auth-form-box">
      <h2>Forgot Password</h2>
      <form id="forgotForm" class="auth-form">
        <input type="email" name="email" placeholder="Enter your email" required />
        <button type="submit" class="btn">Send Reset Link</button>
      </form>
    </div>
  </div>
</div>

<div id="toast" class="toast">Reset link sent</div>

<script type="module">
  const toast = document.getElementById("toast");

  function showToast(message, isSuccess = true) {
    toast.textContent = message;
    toast.style.backgroundColor = isSuccess ? "#28a745" : "#dc3545";
    toast.classList.add("show");

    setTimeout(() => {
      toast.classList.remove("show");
    }, 3000);
  }

  document.getElementById("forgotForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = e.target.email.value;
    try {
      const res = await fetch("http://localhost:8080/api/auth/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });

      if (res.ok) {
        showToast("Check your email for reset instructions.");
        e.target.reset();
      } else {
        const msg = await res.text();
        showToast(msg || "Failed to send reset link.", false);
      }
    } catch (err) {
      showToast("Something went wrong.", false);
    }
  });
</script>

</body>
</html>
