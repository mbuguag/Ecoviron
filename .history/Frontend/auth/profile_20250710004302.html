<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Profile | Ecoviron</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div id="header-container"></div>

  <body>
  <div class="profile-container">
    <aside class="sidebar">
      <div class="profile-picture-container">
        <img id="profile-picture" src="default.jpg" alt="Profile Picture" />
        <input type="file" id="upload-picture" hidden />
        <button id="change-picture-btn">Change Picture</button>
      </div>
      <nav class="profile-nav">
        <ul>
          <li data-section="info" class="active">Profile Info</li>
          <li data-section="orders">Order History</li>
          <li data-section="wishlist">Wishlist</li>
          <li data-section="security">Security Settings</li>
          <li><button id="logout-btn">Logout</button></li>
        </ul>
      </nav>
    </aside>

    <main class="profile-content">
      <!-- Dynamic sections here -->
      <section id="info-section" class="section active">
        <!-- Editable profile form -->
      </section>

      <section id="orders-section" class="section">
        <!-- Past orders -->
      </section>

      <section id="wishlist-section" class="section">
        <!-- Saved items -->
      </section>

      <section id="security-section" class="section">
        <!-- Change password form -->
      </section>
    </main>
  </div>
</body>

</html>
