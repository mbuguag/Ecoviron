<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIONIX-EHS</title>
    <link rel="stylesheet" href="../css/">
    <script src="https://kit.fontawesome.com/a2e0e6ad1f.js" crossorigin="anonymous"></script>
  </head>

  <body>

    <header class="site-header">
      <div class="header-container">

        <!-- Left: Logo -->
        <div class="header-left">
          <a href="index.html" class="header-logo-text">BIONIX-EHS</a>
        </div>

        <!-- Center: Navigation -->
        <div class="header-center">
          <nav aria-label="Main navigation">
            <ul class="header-nav-list">
              <li><a href="index.html" class="header-nav-link" aria-current="page">Home</a></li>
              <li><a href="about.html" class="header-nav-link">About</a></li>
              <li class="dropdown">
                <a href="#" class="header-nav-link">Products ▾</a>
                <ul class="dropdown-content">
                  <li><a href="ecommerce/product-grid.html">Shop</a></li>
                  <li><a href="ecommerce/cart.html">Cart</a></li>
                </ul>
              </li>
              <li><a href="services/services.html" class="header-nav-link">Services</a></li>
              <li class="dropdown">
                <a href="#" class="header-nav-link">Resources ▾</a>
                <ul class="dropdown-content">
                  <li><a href="blog/blog.html">Blog</a></li>
                  <li><a href="#">Newsletter</a></li>
                </ul>
              </li>
              <li><a href="contact.html" class="header-nav-link">Contact</a></li>
            </ul>
          </nav>
        </div>

        <!-- Right: Cart & Auth -->
        <div class="header-right">
          <div class="header-actions">
            <a href="ecommerce/cart.html" class="cart-icon-link">
              <i class="fas fa-shopping-cart"></i>
              <span id="mini-cart-count" class="cart-count-badge">0</span>
            </a>
            <div class="user-dropdown">
              <a href="#" class="header-nav-link">
                <i class="fas fa-user"></i>
                <span>Account</span>
              </a>
              <ul class="dropdown-content">
                <li><a href="auth/login.html"><i class="fas fa-sign-in-alt"></i> Login</a></li>
                <li><a href="auth/register.html"><i class="fas fa-user-plus"></i> Register</a></li>
                <li><a href="profile.html"><i class="fas fa-user"></i> Profile</a></li>
                <li><a href="#" class="auth-logout-link"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
              </ul>
            </div>
          </div>
        </div>

        <!-- Mobile Menu Toggle -->
        <button class="header-menu-toggle" aria-label="Toggle menu" aria-expanded="false">
          <span class="header-hamburger-line"></span>
          <span class="header-hamburger-line"></span>
          <span class="header-hamburger-line"></span>
        </button>

      </div>
    </header>

    <script>
      // Mobile menu toggle
      const menuToggle = document.querySelector('.header-menu-toggle');
      const navList = document.querySelector('.header-nav-list');
      const body = document.body;

      menuToggle.addEventListener('click', () => {
        menuToggle.classList.toggle('active');
        navList.classList.toggle('active');
        body.classList.toggle('menu-open');
      });

      // Accordion dropdown on mobile
      document.querySelectorAll('.dropdown > .header-nav-link').forEach(link => {
        link.addEventListener('click', e => {
          if (window.innerWidth <= 768) {
            e.preventDefault();
            const parent = link.parentElement;
            parent.classList.toggle('open');
          }
        });
      });

      // Scroll shrink effect
      window.addEventListener('scroll', () => {
        document.querySelector('.site-header')
          .classList.toggle('shrink', window.scrollY > 50);
      });
    </script>

  </body>

</html>
