<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | Ecoviron Shop</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/checkout.css" />
  </head>

  <body>
    <div id="header-container"></div>

    <main>
      <section class="section-padding checkout-section">
        <div class="container">
          <h2>Checkout</h2>
          
          <div class="checkout-container">
            <form id="checkout-form" class="checkout-form">
              <div class="form-section">
                <h3>Billing Details</h3>
                <div class="form-group">
                  <label for="name">Full Name</label>
                  <input type="text" id="name" name="name" required />
                </div>
                
                <div class="form-group">
                  <label for="email">Email Address</label>
                  <input type="email" id="email" name="email" required />
                </div>
                
                <div class="form-group">
                  <label for="address">Shipping Address</label>
                  <input type="text" id="address" name="address" required />
                </div>
                
                <div class="form-group">
                  <label for="payment">Payment Method</label>
                  <select id="payment" name="payment" required>
                    <option value="">Select payment method...</option>
                    <option value="mpesa">M-Pesa</option>
                    <option value="card">Credit/Debit Card</option>
                  </select>
                </div>
              </div>
              
              <div id="mpesa-payment" class="payment-method form-section">
                <h3>M-Pesa Payment</h3>
                <p>
                  Enter your M-Pesa number to pay for Order <span id="ref"></span>
                </p>
                <div class="form-group">
                  <input type="text" id="phone" placeholder="07XXXXXXXX" pattern="[0-9]{10}" required />
                </div>
                <button type="button" id="pay-btn" class="btn primary">Pay with M-Pesa</button>
                <div id="status" class="status-message"></div>
              </div>
              
              <div id="card-payment" class="payment-method form-section">
                <h3>Card Payment</h3>
                <div class="form-group">
                  <label for="card-number">Card Number</label>
                  <input type="text" id="card-number" placeholder="1234 5678 9012 3456" />
                </div>
                
                <div class="form-group">
                  <label for="card-expiry">Expiry Date</label>
                  <input type="text" id="card-expiry" placeholder="MM/YY" />
                </div>
                
                <div class="form-group">
                  <label for="card-cvc">CVC</label>
                  <input type="text" id="card-cvc" placeholder="123" />
                </div>
              </div>
            </form>
            
            <div class="order-summary">
              <div class="form-section">
                <h3>Order Summary</h3>
                <div id="checkout-summary"></div>
                <div class="form-group">
                  <label for="promo-code">Promo Code (Optional)</label>
                  <input type="text" id="promo-code" placeholder="Enter promo code" />
                </div>
                <button id="apply-promo-btn" class="btn secondary">Apply</button>
                <div class="summary-total">
                  <p>Subtotal: <span id="subtotal">KES 0</span></p>
                  <p>Shipping: <span id="shipping">KES 200</span></p>
                  <p class="total">Total: <span id="total">KES 0</span></p>
                </div>
                <button id="place-order-btn" class="btn primary">
                  Place Order
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer id="footer-container"></footer>

    <script type="module" src="../js/main.js"></script>
    <!-- <script type="module" src="../js/checkout.js"></script> -->
  </body>
</html>
