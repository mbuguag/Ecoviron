<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | Ecoviron Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../">
  </head>

  <body>
    <div id="header-container"></div>

    <main>
      <section class="section-padding checkout-section">
        <div class="container">
          <h2>Checkout</h2>

          <!-- Cart summary rendered by checkout.js -->
          <div id="checkout-summary-container"></div>

          <form id="checkout-form" class="checkout-form">
            <!-- Billing Details -->
            <div class="form-section">
              <h3>Billing Details</h3>
              <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required />
              </div>

              <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required />
              </div>

              <div class="form-group">
                <label for="address">Shipping Address</label>
                <input type="text" id="address" name="address" required />
              </div>
            </div>

            <!-- Payment Method -->
            <div class="form-section">
              <h3>Payment Method</h3>
              <div class="form-group">
                <label for="payment">Select Payment Method</label>
                <select id="payment" name="payment" required>
                  <option value="">Select...</option>
                  <option value="mpesa">M-Pesa</option>
                  <option value="card">Credit/Debit Card</option>
                </select>
              </div>

              <!-- M-Pesa -->
              <div id="mpesa-phone-section" class="payment-details" style="display: none;">
                <div class="form-group">
                  <label for="mpesa-phone">M-Pesa Phone Number</label>
                  <input type="tel" id="mpesa-phone" name="mpesa-phone" placeholder="e.g. 254712345678"
                    pattern="254[17][0-9]{8}" title="Enter a valid M-Pesa number (2547XXXXXXXX)" />
                </div>
              </div>

              <!-- Card Placeholder -->
              <div id="card-details-section" class="payment-details" style="display: none;">
                <!-- Future card details -->
                <div class="form-group">
                  <p>Credit/Debit card integration coming soon.</p>
                </div>
              </div>
            </div>

            <!-- Order Summary -->
            <div class="order-summary">
              <h3>Order Summary</h3>
              <div id="checkout-summary"></div>
              <button id="place-order-btn" class="btn primary" type="submit">
                Place Order
              </button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <footer id="footer-container"></footer>

    <!-- Scripts -->
    <script type="module" src="../js/main.js"></script>
    <script type="module" src="../js/checkout.js"></script>
  </body>

</html>
