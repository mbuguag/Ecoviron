<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details | Ecoviron Shop</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>

<body>
  <!-- Header (injected by JS) -->
  <div id="header-container"></div>

  <main>
    <section class="section-padding product-detail-section">
      <div class="container">
        <a href="product-grid.html" class="back-link">← Back to Shop</a>

        <!-- Product Detail -->
        <div id="product-detail" class="product-detail-wrapper">
          <!-- JS injects product details here -->
        </div>

        <!-- You May Also Like -->
        <section class="related-products-section section-padding">
          <div class="container">
            <h3>You May Also Like</h3>
            <div id="related-products" class="grid-three-columns">
              <!-- JS injects related products here -->
            </div>
          </div>
        </section>

      </div>
    </section>
  </main>

  <!-- Footer (injected by JS) -->
  <footer id="footer-container"></footer>

  <!-- Scripts -->
  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/product-details.js"></script>
  <script type="module" src="../js/cart-actions.js"></script>
</body>

</html>
