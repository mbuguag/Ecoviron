<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Details | Ecoviron Shop</title>

  <!-- FontAwesome & Styles -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../css/styles.css"/>

  <!-- AOS CSS -->
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet" />

  <!-- AOS JS -->
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
</head>
<body>
  <!-- Header Placeholder -->
  <div id="header-container"></div>

  <!-- Main Content -->
  <section class="product-detail-modern section-padding">
    <div class="container product-grid">
      <div class="product-gallery">
        <img id="main-product-image" class="main-image" src="" alt="Product Image">
        <div class="thumbnail-row" id="gallery-thumbnails">
          <!-- Injected thumbnails -->
        </div>
      </div>

      <div class="product-info">
        <span class="product-category" id="product-category">Category</span>
        <h1 class="product-title" id="product-name">Product Name</h1>
        <div class="price-wishlist-row">
          <span class="product-price" id="product-price">KES 0</span>
          <button class="wishlist-btn" id="wishlist-btn">
            <i class="fa fa-heart"></i>
          </button>
        </div>
        <div class="rating" id="product-rating">★★★★☆</div>
        <p id="product-description" class="product-description">Description...</p>

        <ul class="eco-features" id="eco-features">
          <!-- Optional icons -->
        </ul>

        <button class="btn btn-primary" id="add-to-cart-btn">Add to Cart</button>

        <div class="trust-badges">
          <img src="../assets/icons/secure-payment.png" alt="Secure Payment">
          <img src="../assets/icons/eco-friendly.png" alt="Eco Guarantee">
        </div>
      </div>
    </div>
  </section>

  <!-- Related Products -->
  <section class="related-products-section container">
    <h3>Related Products</h3>
    <div id="related-products" class="related-grid"></div>
  </section>

  <!-- Sticky Bars -->
  <div id="mobile-cart-bar" class="mobile-cart-bar"></div>
  <div class="sticky-bar" id="mobile-sticky-bar" style="display: none;">
    <span class="price" id="sticky-price"></span>
    <button class="btn" id="sticky-add-to-cart">Add to Cart</button>
  </div>

  <!-- Footer Placeholder -->
  <footer id="footer-container"></footer>

  <!-- JS Modules -->
  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/product-details.js"></script>
  <script type="module" src="../js/cart-actions.js"></script>
</body>
</html>
