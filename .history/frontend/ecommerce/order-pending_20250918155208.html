<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Order Pending - Ecoviron</title>
        <link rel="stylesheet" href="../css/style.css" />
    </head>

    <body class="bg-gray-50">
        <div class="max-w-3xl mx-auto p-6">
            <h1 class="text-2xl font-bold text-center mb-6">Your Order is Pending</h1>
            <p class="text-center text-gray-600 mb-6">
                Thank you for your purchase. Your order has been placed successfully and is now awaiting payment
                confirmation.
            </p>

            <!-- Order Details -->
            <div id="order-details" class="bg-white p-6 rounded-lg shadow-md"></div>

            <!-- Actions -->
            <div class="flex justify-center gap-4 mt-6">
                <button id="refresh-status" class="px-4 py-2 bg-blue-600 text-white rounded-md">
                    Refresh Status
                </button>
                <a href="../index.html" class="px-4 py-2 bg-gray-300 text-gray-800 rounded-md">
                    Continue Shopping
                </a>
            </div>
        </div>

        <script type="module" src="../js/order-pending.js"></script>
    </body>

</html>
