# --- Datasource (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/ecoviron_db
spring.datasource.username=root
spring.datasource.password=${LOCAL_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- HikariCP ---
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- Logging (debug for dev) ---
logging.level.com.example.ecoviron=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=DEBUG

# --- Mpesa Sandbox ---
mpesa.baseUrl=https://sandbox.safaricom.co.ke
mpesa.shortCode=174379
mpesa.consumerKey=${MPESA_CONSUMER_KEY}
mpesa.consumerSecret=${MPESA_CONSUMER_SECRET}
mpesa.passkey=${MPESA_PASSKEY}
mpesa.callbackUrl=${MPESA_CALLBACK_URL:http://localhost:8080/api/payment/callback}

# --- Newsletter ---
newsletter.confirmation-url=http://localhost:8080/api/newsletter/confirm
newsletter.unsubscribe-url=http://localhost:8080/api/newsletter/unsubscribe
