spring.application.name=ecoviron
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

spring.datasource.url=jdbc:mysql://localhost:3306/ecoviron_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.main.allow-bean-definition-overriding=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mbuguajoseph498@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

admin.email=${ADMIN_EMAIL}

newsletter.confirmation-url=http://localhost:8080/api/newsletter/confirm
newsletter.unsubscribe-url=http://localhost:8080/api/newsletter/unsubscribe


# For reset link base
app.reset-password.base-url=http://localhost:5500/frontend/auth/reset-password.html

upload.base-path=/app/uploads
upload.profile-path=${upload.base-path}/profile-pics
upload.product-path=${upload.base-path}/product-images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true


spring.web.resources.static-locations=classpath:/static/,file:${upload.base-path}/

spring.web.resources.add-mappings=true


#PAYMENT GATEWAY
mpesa.consumerKey=${MPESA_CONSUMER_KEY}
mpesa.consumerSecret=${MPESA_CONSUMER_SECRET}
mpesa.shortCode=174379
mpesa.passkey=${MPESA_PASSKEY}
mpesa.baseUrl=https://sandbox.safaricom.co.ke
mpesa.callbackUrl=https://www.bionix-hse.co.ke/api/payment/callback


spring.jpa.open-in-view=true


logging.level.com.example.ecoviron.controller=DEBUG
logging.level.org.springframework.web=DEBUG

