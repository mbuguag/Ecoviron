# ==========================
# Core App Settings
# ==========================
spring.application.name=ecoviron
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==========================
# JWT Authentication
# ==========================
jwt.secret=${JWT_SECRET:change-me-512-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================
# Mail Configuration
# ==========================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ==========================
# Application URLs
# ==========================
app.base.url=${APP_BASE_URL:http://localhost:8080}

# --- Reset Password ---
app.reset.password-url=${RESET_PASSWORD_URL:${app.base.url}/api/auth/reset-password}

# --- Admin ---
app.admin.email=${ADMIN_EMAIL:admin@example.com}
app.admin.dashboard-url=${ADMIN_DASHBOARD_URL:${app.base.url}/admin}

# --- Newsletter ---
app.newsletter.confirmation-url=${NEWSLETTER_CONFIRMATION_URL:${app.base.url}/api/newsletter/confirm}
app.newsletter.unsubscribe-url=${NEWSLETTER_UNSUBSCRIBE_URL:${app.base.url}/api/newsletter/unsubscribe}

# ==========================
# Cloudinary (optional)
# ==========================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ==========================
# File Upload
# ==========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================
# Static Resources
# ==========================
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.add-mappings=true

# ==========================
# Monitoring & Actuator
# ==========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
