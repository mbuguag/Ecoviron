spring.application.name=ecoviron
#server.port=10000
# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Required for PostgreSQL with Hibernate 6+
spring.jpa.database=postgresql
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Other recommended updates:
server.port=${PORT:8080}  # Let Render set the port
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Security Configuration
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.connection-time-zone=UTC
spring.main.allow-bean-definition-overriding=true


# --- JWT / Mail (env provide secrets) ---
jwt.secret=${JWT_SECRET:your-very-secure-secret-at-least-512-bits-long}
jwt.expiration=86400000
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:someone@example.com}
spring.mail.password=${MAIL_PASSWORD:password-here}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

admin.email=${ADMIN_EMAIL}

# --- Multipart / static ---
upload.base-path=uploads
upload.profile-path=${upload.base-path}/profile-pics
upload.product-path=${upload.base-path}/product-images
upload.blog-path=${upload.base-path}/blog-images

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.web.resources.static-locations=classpath:/static/,file:${upload.base-path}/
spring.web.resources.add-mappings=true



#PAYMENT GATEWAY
mpesa.consumerKey=${MPESA_CONSUMER_KEY:default-key}
mpesa.consumerSecret=${MPESA_CONSUMER_SECRET:default-secret}
mpesa.passkey=${MPESA_PASSKEY:default-passkey}
mpesa.shortCode=174379
mpesa.baseUrl=https://sandbox.safaricom.co.ke
mpesa.callbackUrl=https://www.bionix-hse.co.ke/api/payment/callback

# --- App URLs (override in dev/prod profiles if needed) ---
newsletter.confirmation-url=${NEWSLETTER_CONFIRM_URL:http://localhost:8080/api/newsletter/confirm}
newsletter.unsubscribe-url=${NEWSLETTER_UNSUB_URL:http://localhost:8080/api/newsletter/unsubscribe}
app.reset-password.base-url=${RESET_BASE_URL:http://localhost:5500/frontend/auth/reset-password.html}


spring.jpa.open-in-view=true

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=30000

logging.level.com.example.ecoviron.controller=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.hibernate.SQL=DEBUG

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always


